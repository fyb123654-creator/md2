<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
  <rect width="1200" height="760" fill="#f8fafc"/>
  <text x="600" y="50" text-anchor="middle" font-size="30" font-family="Arial" font-weight="bold" fill="#0f172a">Core Class Relationship Snapshot</text>
  <g font-family="Arial">
    <rect x="90" y="130" width="220" height="90" rx="16" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="200" y="170" text-anchor="middle" font-size="24" font-weight="bold" fill="#1d4ed8">GameApp</text><text x="200" y="198" text-anchor="middle" font-size="18" fill="#334155">Launches views and scenes</text>
    <rect x="350" y="130" width="260" height="110" rx="16" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/><text x="480" y="170" text-anchor="middle" font-size="24" font-weight="bold" fill="#0369a1">GameController</text><text x="480" y="198" text-anchor="middle" font-size="18" fill="#334155">UI behaviour, timer, chat,</text><text x="480" y="223" text-anchor="middle" font-size="18" fill="#334155">drag & drop, turn presentation</text>
    <rect x="670" y="120" width="280" height="130" rx="16" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="810" y="160" text-anchor="middle" font-size="24" font-weight="bold" fill="#166534">GameManager</text><text x="810" y="188" text-anchor="middle" font-size="18" fill="#334155">Facade for turn flow, card play,</text><text x="810" y="213" text-anchor="middle" font-size="18" fill="#334155">validation, winner detection,</text><text x="810" y="238" text-anchor="middle" font-size="18" fill="#334155">event publishing</text>
    <rect x="980" y="130" width="160" height="90" rx="16" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="1060" y="170" text-anchor="middle" font-size="22" font-weight="bold" fill="#6d28d9">CardManager</text><text x="1060" y="198" text-anchor="middle" font-size="17" fill="#334155">Deck / discard logic</text>
    <rect x="620" y="340" width="220" height="110" rx="16" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="730" y="380" text-anchor="middle" font-size="24" font-weight="bold" fill="#92400e">PlayerManagement</text><text x="730" y="408" text-anchor="middle" font-size="18" fill="#334155">Hand, bank, properties,</text><text x="730" y="433" text-anchor="middle" font-size="18" fill="#334155">set completion rules</text>
    <rect x="900" y="340" width="180" height="110" rx="16" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="990" y="380" text-anchor="middle" font-size="24" font-weight="bold" fill="#b91c1c">PropertyZone</text><text x="990" y="408" text-anchor="middle" font-size="18" fill="#334155">Cards + buildings</text><text x="990" y="433" text-anchor="middle" font-size="18" fill="#334155">for a colour set</text>
    <rect x="160" y="350" width="220" height="110" rx="16" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/><text x="270" y="390" text-anchor="middle" font-size="24" font-weight="bold" fill="#6d28d9">GameServer</text><text x="270" y="418" text-anchor="middle" font-size="18" fill="#334155">Accepts clients, validates</text><text x="270" y="443" text-anchor="middle" font-size="18" fill="#334155">room state, broadcasts updates</text>
    <rect x="150" y="540" width="220" height="100" rx="16" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/><text x="260" y="580" text-anchor="middle" font-size="24" font-weight="bold" fill="#6d28d9">GameClient</text><text x="260" y="608" text-anchor="middle" font-size="18" fill="#334155">Sends commands, receives state</text>
    <rect x="430" y="540" width="220" height="100" rx="16" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/><text x="540" y="580" text-anchor="middle" font-size="24" font-weight="bold" fill="#6d28d9">GameStateData</text><text x="540" y="608" text-anchor="middle" font-size="18" fill="#334155">DTO for online synchronisation</text>
  </g>
  <g stroke="#475569" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <line x1="310" y1="175" x2="350" y2="175"/><line x1="610" y1="185" x2="670" y2="185"/><line x1="950" y1="175" x2="980" y2="175"/>
    <line x1="790" y1="250" x2="750" y2="340"/><line x1="870" y1="250" x2="960" y2="340"/><line x1="380" y1="405" x2="620" y2="405"/>
    <line x1="270" y1="460" x2="260" y2="540"/><line x1="370" y1="590" x2="430" y2="590"/><line x1="650" y1="590" x2="810" y2="250"/>
  </g>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#475569"/></marker></defs>
</svg>